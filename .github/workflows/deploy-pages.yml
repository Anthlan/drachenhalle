name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./apps/website
        run: pnpm install --frozen-lockfile

      - name: Count files in Dropbox inbox
        working-directory: ./apps/website
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: node scripts/generate-inbox-count.mjs

      - name: Build static Astro website
        working-directory: ./apps/website
        env:
          PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN }}
          PUBLIC_PLAN_API_URL: ${{ vars.PUBLIC_PLAN_API_URL }}
          PUBLIC_PAGE_VIEWS_API_URL: ${{ vars.PUBLIC_PAGE_VIEWS_API_URL }}
        run: pnpm run build

      - name: Verify Pages entry points
        working-directory: ./apps/website
        run: |
          test -s dist/index.html
          test -s dist/tools/kartenplaner/index.html
          test -d dist/_astro
          touch dist/.nojekyll
          du -sh dist

      - name: Upload static website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps/website/dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
